name: RetailSystem
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: com.mateu.retail
targets:
  RetailSystem:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - Config
          - RetailSystem.xcodeproj
    info:
      path: Config/Info.plist
    settings:
      configs:
        Debug:
          base:
            INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
          xcconfig: Config/Debug.xcconfig
        Release:
          base:
            INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
          xcconfig: Config/Release.xcconfig
    scheme:
      testTargets: []
