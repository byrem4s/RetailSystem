name: RetailSystem
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: com.mateu.retail
targets:
  RetailSystem:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - Config
          - Resources
          - RetailSystem.xcodeproj
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        CFBundleDisplayName: Reposición Mateu
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Reposición Mateu necesita conectarse al servidor de la empresa
          durante el desarrollo y la operación en la red interna.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "YES"
        Release:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "NO"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    scheme:
      testTargets: []
